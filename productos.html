<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos · Level Up</title>
  <meta name="description" content="Catálogo de Level Up: Nintendo Switch OLED, Switch V2, accesorios y más. Usados y open box.">
  <link rel="icon" href="assets/emblema.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="productos">
  <main class="container block">
    <h1 class="section-title"><span class="pink">CATALOGO</span></h1>
    <p class="section-sub">Consolas y accesorios usados y open box. ¿No ves lo que buscas? Escríbenos.</p>

    <div class="toolbar">
      <label class="search">
        🔍 <input id="buscar" type="search" placeholder="Buscar: OLED, Mario, Joy-Con…" autocomplete="off">
      </label>
      <label class="toggle"><input type="checkbox" id="soloDisp"> Solo disponibles</label>
    </div>

    <div class="chips-row" style="display:flex;flex-wrap:wrap;gap:8px 22px">
      <div class="chips" data-key="categoria">
        <button class="chip on" data-val="todos">Todo</button>
        <button class="chip" data-val="consola">Consolas</button>
        <button class="chip" data-val="accesorio">Accesorios</button>
      </div>
      <div class="chips" data-key="marca">
        <button class="chip on" data-val="todas">Todas las marcas</button>
        <button class="chip" data-val="Nintendo">Nintendo</button>
        <button class="chip" data-val="PlayStation">PlayStation</button>
      </div>
      <div class="chips" data-key="condicion">
        <button class="chip on" data-val="todas">Cualquier estado</button>
        <button class="chip" data-val="usado">Usado</button>
        <button class="chip" data-val="openbox">Open box</button>
      </div>
    </div>

    <p class="count" id="count"></p>
    <div class="grid" id="catalogo"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="data/productos.js"></script>
  <script src="data/fotos.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>
